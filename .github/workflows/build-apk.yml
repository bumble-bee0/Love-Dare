name: Build APK from Zip

on:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
      - '!admin-app.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Siapkan folder www
        run: |
          rm -rf www assets
          mkdir www
          shopt -s nullglob
          for f in *.zip; do
            if [ "$f" != "admin-app.zip" ]; then
              echo "Mengekstrak $f ..."
              unzip -o "$f" -d www
              rm "$f"
            fi
          done
          if [ ! -f www/index.html ]; then
            echo "Zip tidak ditemukan, pakai file yang sudah ada di root"
            cp index.html manifest.json service-worker.js icon-192.png icon-512.png icon-maskable-192.png icon-maskable-512.png apple-touch-icon.png www/ 2>/dev/null || true
          fi
          echo "Isi folder www:"
          ls -la www

      - name: Siapkan aset ikon dan splash
        run: |
          # Folder resources/ dari zip dipakai untuk ikon & splash APK (bukan untuk isi web)
          if [ -f www/resources/icon.png ]; then
            mkdir -p assets
            cp www/resources/icon.png assets/icon-only.png
            cp www/resources/icon.png assets/icon-foreground.png
            cp www/resources/icon.png assets/icon-background.png
            [ -f www/resources/splash.png ] && cp www/resources/splash.png assets/splash.png
            rm -rf www/resources
            echo "Aset APK:"
            ls -la assets
          else
            echo "PERINGATAN: www/resources/icon.png tidak ada, ikon akan pakai bawaan Capacitor"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Buat project Capacitor
        run: |
          rm -rf android node_modules package.json package-lock.json capacitor.config.json capacitor.config.ts
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/device
          npm install --save-dev @capacitor/assets
          # Nama aplikasi: Love Dare. appId sengaja TIDAK diubah supaya tetap dianggap aplikasi yang sama.
          cat > capacitor.config.json << 'EOF2'
          {
            "appId": "com.lovedare.ulartangga",
            "appName": "Love Dare",
            "webDir": "www",
            "backgroundColor": "#671929",
            "android": {
              "backgroundColor": "#671929"
            }
          }
          EOF2
          npx cap add android

      - name: Cegah screenshot & screen recording di dalam aplikasi
        run: |
          MAIN_ACTIVITY="android/app/src/main/java/com/lovedare/ulartangga/MainActivity.java"
          if [ -f "$MAIN_ACTIVITY" ]; then
            cat > "$MAIN_ACTIVITY" << 'EOF'
          package com.lovedare.ulartangga;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // Blokir screenshot & screen recording, dan sembunyikan pratinjau
                  // aplikasi ini di daftar "recent apps".
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );
              }
          }
          EOF
            echo "MainActivity.java berhasil dipatch dengan FLAG_SECURE."
          else
            echo "PERINGATAN: MainActivity.java tidak ditemukan di path yang diharapkan, langkah ini dilewati."
          fi

      - name: Pasang ikon dan splash
        run: |
          if [ -f assets/icon-only.png ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#671929' --splashBackgroundColor '#671929'
          else
            echo "Lewati: tidak ada assets/icon-only.png"
          fi

      - name: Warna latar window (hilangkan blank hitam saat buka)
        run: |
          python3 - << 'PY'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/res/values/styles.xml')
          s = p.read_text()
          warna = '#671929'
          def patch(m):
              blok = re.sub(r'\s*<item name="android:(background|windowBackground)">[^<]*</item>', '', m.group(0))
              return blok.replace('</style>', '    <item name="android:background">%s</item>\n        <item name="android:windowBackground">%s</item>\n    </style>' % (warna, warna))
          s2 = re.sub(r'<style name="AppTheme\.NoActionBar"[^>]*>.*?</style>', patch, s, flags=re.S)
          p.write_text(s2)
          print(s2)
          PY

      - name: Fix konflik duplicate Kotlin stdlib
        run: |
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Pasang kunci tanda tangan tetap
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "PERINGATAN: Secret RELEASE_KEYSTORE_BASE64 belum diatur, APK akan pakai kunci sementara (device_id pembeli akan berubah lagi)."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Sync file web + plugin ke project Android
        run: npx cap sync android

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -f app/release.keystore ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Siapkan path APK hasil build
        id: apk
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: lovedare-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Buat Release dengan APK (link download permanen)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "LoveDare APK (Auto-build)"
          make_latest: true
          files: ${{ steps.apk.outputs.path }}
